name: CI - aula-16

on:
  push:
    paths:
      - 'aula-16/**'
  pull_request:
    paths:
      - 'aula-16/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Atualizar pip
        run: python -m pip install --upgrade pip

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          
      - name: Rodar black
        working-directory: aula-16
        run: |
          black --version
          black --check .

      - name: Rodar flake8
        working-directory: aula-16
        run: |
          flake8 .

      - name: Rodar testes
        working-directory: aula-16
        run: |
          pytest
